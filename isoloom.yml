# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# OWASP SKF Session Hijacking through XSS (OWASP Security Knowledge Framework labs, by Glenn ten Cate, Riccardo ten Cate and the SKF contributors) as an Isoloom spec:
# a Flask app with a stored message field and a session cookie without the HttpOnly flag (session hijacking via XSS). The SKF lab folder python/session-hijacking-xss is
# vendored unchanged in app/ and built by its own Dockerfile.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: skf-session-hijacking-xss

networks:
  lab: { cidr: 10.60.148.0/24, internet: false }

machines:
  web:
    networks: { lab: 10 }
    services: [{ port: 5000, name: web, http: true, publish: 5050 }]
    resources: { cpus: 1, memory_mb: 256 }
    docker:
      build: app

checks:
  - name: the lab answers
    http: http://web:5000/
    wait: 120
  - name: admin/admin logs in and the session cookie is not HttpOnly
    script: checks/cookie.sh

message: |
  OWASP SKF Session Hijacking through XSS answers at http://localhost:{{ machines.web.services.0.publish }}/.
  Log in with admin/admin and look at the flags of the session cookie.
